name: Generate English voices

# Runs Orpheus TTS (free, open source) on GitHub's machines, one job per girl in parallel.
#   sample: a few joined preview clips per girl, downloadable as artifacts, to listen first
#   full:   every English clip, committed to the repo, then the Android build is started
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sample (preview a few clips) or full (generate and commit everything)"
        type: choice
        options: [sample, full]
        default: sample
      girls:
        description: 'Which girls, as a JSON list (for example ["rei"])'
        type: string
        default: '["hana","rei","aiko","yui"]'
      shards:
        description: 'Full mode: which slices, as a JSON list (for example [5])'
        type: string
        default: "[0,1,2,3,4,5,6,7]"
      reuse_run:
        description: "Full mode: id of a failed run whose finished slices should be merged too (artifacts last 3 days)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        girl: ${{ fromJSON(inputs.girls) }}
        # Full mode splits each character into 8 slices so every job stays well under GitHub's 6-hour limit.
        shard: ${{ fromJSON(inputs.mode == 'full' && inputs.shards || '[0]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-voices-en.txt

      - name: Install Orpheus
        run: |
          # ffmpeg comes from the imageio-ffmpeg pip package (apt mirrors can take 20+ minutes).
          # Portable CPU build (AVX2), so a pip-cached wheel also works on other runner CPUs.
          CMAKE_ARGS="-DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON" \
            pip install --no-binary llama-cpp-python -r scripts/requirements-voices-en.txt

      - name: Cache Orpheus model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: orpheus-3b-q4km-snac-v1

      - name: Generate ${{ matrix.girl }} (slice ${{ matrix.shard }})
        run: >
          python scripts/generate_voices_en.py --girl ${{ matrix.girl }}
          ${{ inputs.mode == 'sample' && '--sample' || format('--shard {0} --shards 8', matrix.shard) }}

      - name: Upload samples
        if: inputs.mode == 'sample'
        uses: actions/upload-artifact@v4
        with:
          name: samples-${{ matrix.girl }}
          path: .voicegen/samples/en/listen/

      - name: Upload clips
        if: inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: voices-${{ matrix.girl }}-${{ matrix.shard }}
          path: assets/voices/en/${{ matrix.girl }}/
          retention-days: 3

  commit:
    if: inputs.mode == 'full'
    needs: generate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download finished slices from the earlier run
        if: inputs.reuse_run != ''
        uses: actions/download-artifact@v4
        with:
          pattern: voices-*
          path: ${{ runner.temp }}/voices
          run-id: ${{ inputs.reuse_run }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          pattern: voices-*
          path: ${{ runner.temp }}/voices

      - name: Merge the slices and rebuild the index
        run: |
          mkdir -p assets/voices/en
          for dir in "$RUNNER_TEMP"/voices/voices-*; do
            name="${dir##*/voices-}"; g="${name%-*}"
            mkdir -p "assets/voices/en/$g"
            cp -R "$dir"/. "assets/voices/en/$g/"
          done
          python - <<'PY'
          import json, pathlib
          for girl in pathlib.Path("assets/voices/en").iterdir():
              parts = sorted(girl.glob("manifest-*.json"))
              if not parts:
                  continue
              base = girl / "manifest.json"
              merged = json.loads(base.read_text()) if base.exists() else {}
              for p in parts:
                  merged.update(json.loads(p.read_text()))
                  p.unlink()
              (girl / "manifest.json").write_text(json.dumps(merged, indent=0, sort_keys=True) + "\n")
              print(girl.name, len(merged), "clips")
          PY
          python scripts/generate_voices_en.py --prune

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/voices/en src/data/voice-assets.ts
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Generate English voices with Orpheus"
          git push

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the APK build explicitly.
      - name: Start Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref main
